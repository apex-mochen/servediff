[build-system]
requires = ["setuptools>=77"]  # SPDX string `license` (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "servediff"
version = "0.4.32"
description = "Diff what your vLLM / SGLang server actually ran with: auto-selected backends, CUDA graphs, startup failures, dependency versions."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []
keywords = [
  "vllm",
  "sglang",
  "llm-inference",
  "inference-server",
  "llm-serving",
  "startup-log",
  "log-diff",
  "kv-cache",
  "cuda-graph",
  "moe",
  "tensor-parallel",
  "performance-regression",
  "debugging",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Logging",
]

[project.urls]
Homepage = "https://github.com/apex-mochen/servediff"
Issues = "https://github.com/apex-mochen/servediff/issues"
Changelog = "https://github.com/apex-mochen/servediff/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
servediff = "servediff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
servediff = ["examples/*.log"]

[tool.pytest.ini_options]
testpaths = ["tests"]

