name: ci

on:
  push:
  pull_request:

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build the wheel and use it from a clean venv
        run: python tools/check_wheel.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[dev]"
      - run: pytest -q
      - name: Every command over every log, and the ways to mistype them
        run: python tools/cli_sweep.py
      - name: README quick start
        shell: bash
        run: |
          set +e
          servediff diff examples/issue-excerpts/vllm-47047-v0.23-default.log examples/issue-excerpts/vllm-47047-v0.23-marlin.log | tee out.txt
          test "${PIPESTATUS[0]}" -eq 1 && grep -q "MARLIN (NvFp4)" out.txt
      - name: Audit every shipped log, and fail if any line became unread
        shell: bash
        run: |
          set -e
          # 21 hand-written excerpts, 11 October pastes, 7 and 28 November pastes.
          # Each directory is already at zero shapes worth a look, so --max-shapes 0
          # turns this into a regression gate on real server output: a rule edit that
          # stops reading a real line fails CI here instead of shipping. Every directory
          # listed here must hold at least one log: since 0.4.111 a directory with no log
          # inside is an input error (exit 2), because a gate that measured nothing is not
          # a pass. tests/fixtures/sglang-2026-11 is deliberately absent for that reason --
          # it holds PROVENANCE.md for the pastes that were found and kept in 2026-10.
          for d in tests/fixtures tests/fixtures/held-out-2026-10 \
                   tests/fixtures/held-out-2026-11 tests/fixtures/held-out-2026-11b \
                   tests/fixtures/full-cpu-2026-11 tests/fixtures/sglang-2026-10 \
                   tests/fixtures/vllm-forum-2026-06 tests/fixtures/vllm-forum-2026-05; do
            servediff audit "$d" --max-shapes 0
          done
      - name: Check the exit codes the README promises
        shell: bash
        run: |
          set -e
          # `1` means the inputs differ and `2` means the input was broken; scripts branch
          # on that. This walks the command table in README.md and fails when the tool
          # returns a different number -- or a traceback, which is never an answer.
          python tools/verify_readme_exit_codes.py
